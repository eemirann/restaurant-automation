# ============================================================
# Müşteri QR Menüsü — statik SPA + backend'e sınırlı proxy
#
# NEDEN PROXY: Menü, API'yi KENDİ ADRESİ üzerinden (göreli /api) çağırır.
# Böylece menü hangi adresten servis edilirse edilsin — yerel IP
# (http://192.168.1.50:8081) ya da Cloudflare Tunnel alan adı
# (https://menu.restoranim.com) — imajın YENİDEN DERLENMESİ gerekmez ve
# tek origin olduğu için CORS hiç devreye girmez.
#
# GÜVENLİK: Backend'in TAMAMI değil, yalnızca anonim müşterinin ihtiyaç
# duyduğu uçlar açılır (/api/public/* ve GET /api/settings). /api/auth
# (giriş), /api/products, /api/reports gibi personel uçları buradan
# ERİŞİLEMEZ. Cloudflare tüneli de SADECE bu konteynere bağlandığı için
# yönetim paneli (8080) ve backend portu (4091) internete hiç çıkmaz.
# ============================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker'ın gömülü DNS'i — backend konteyneri yeniden oluşturulup IP'si
    # değiştiğinde nginx'in yeniden başlatılmasına gerek kalmaması için
    # proxy_pass hedefi çalışma anında çözümlenir (statik hedef, nginx
    # açılışında bir kez çözümlenip önbelleğe alınırdı).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------- Anonim müşteri uçları ----------
    location /api/public/ {
        set $backend_upstream "backend:4091";
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Genel ayarlar (restoran adı, not, sosyal medya) ----------
    # Sadece OKUMA açılır. Ayarları DEĞİŞTİRME (PUT) zaten Admin JWT ister,
    # ama buradan hiç geçirmeyerek yüzeyi büsbütün daraltıyoruz.
    location = /api/settings {
        limit_except GET HEAD { deny all; }
        set $backend_upstream "backend:4091";
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Ürün görselleri ----------
    location /uploads/ {
        set $backend_upstream "backend:4091";
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public";
    }

    # NOT — RATE LIMIT: Backend'de 'trust proxy' BİLEREK açılmadı. Açılsaydı
    # express, X-Forwarded-For başlığına güvenirdi; backend portu (4091) yerel
    # ağdan doğrudan erişilebilir olduğu için bir saldırgan bu başlığı taklit
    # ederek 4 haneli PIN'i koruyan giriş limitini (loginLimiter) atlatabilirdi.
    # Sonuç: müşteri menüsü trafiği backend'e bu konteynerin IP'siyle ulaşır ve
    # tek bir sayaç paylaşır. Bu, middleware/rateLimiters.js'te zaten varsayılan
    # senaryodur (restoran Wi-Fi'ındaki tüm müşteriler NAT arkasında aynı genel
    # IP'yi paylaşır) ve limitler buna göre boyutlandırılmıştır. İnternete
    # açtığınızda ek koruma için Cloudflare tarafındaki rate limiting'i kullanın.

    # ---------- SPA ----------
    # Tüm yollar index.html'e düşer (React Router client-side routing,
    # QR linki /:qrToken şeklinde geldiği için bu ÖNEMLİ).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Statik varlıklar uzun cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
