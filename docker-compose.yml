# ============================================================
# !!! ÜRETİM KURULUMU ARTIK DOCKER KULLANMIYOR !!!
#
# Kasa/POS bilgisayarına kurulum SQL Server Express + Windows Servisi ile
# yapılır (bkz. installer\README.md). Bu compose dosyası SADECE GELİŞTİRME
# içindir ve installer tarafından ARTIK KOPYALANMAZ.
#
# Üretimdeki karşılıkları:
#   db            -> SQL Server Express (installer\kurulum-sql-express.ps1)
#   backend       -> 'RestoranBackend' Windows Servisi (installer\servis-kur.ps1)
#   customer-menu -> backend'in kendisi (server.js, musteri-menu\dist statik)
#   panel         -> Tauri masaüstü .exe (ayrı dağıtılır)
# ============================================================
# Restoran POS — tam yığın (MSSQL + backend + panel)
# Kullanım:
#   1) Kök dizinde .env oluşturun (JWT_SECRET, DB_PASSWORD zorunlu)
#   2) docker compose up -d --build
#   3) Veritabanını ve şemayı hazırlayın (ilk kurulumda bir kez):
#        docker compose exec db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
#          -P "$DB_PASSWORD" -C -Q "IF DB_ID('RestoranDB') IS NULL CREATE DATABASE RestoranDB"
#        docker compose run --rm backend npm run migrate
#      (Not: mssql/server imajı mssql-tools18'e geçti — eski yollarda
#      kurulu 'mssql-tools' imajlarında hâlâ /opt/mssql-tools/bin/sqlcmd
#      olabilir, -C bayrağı sertifika güvenini kabul eder.)
#   Panel:         http://localhost:8080
#   Backend:       http://localhost:4091
#   Müşteri Menü:  ayrı servis YOK — backend servis eder:
#                  http://localhost:4091/<masa-qr-kodu>
#                  (geliştirmede: cd musteri-menu && npm run dev -> :5174)
# ============================================================
# 'name' SABİT tutulur (klasör adına göre otomatik türetilmez): scripts/
# paketle.ps1 ile offline paketlenen imaj etiketleri (<name>-backend vb.)
# bu sabit isme göre üretilir. installer/postinstall.ps1 dosyaları
# C:\RestoranOtomasyonu gibi FARKLI bir klasöre kopyaladığı için, isim
# klasöre göre türetilseydi 'docker compose up -d' yüklenen imajları
# bulamaz, offline kurulum bozulurdu (bkz. installer/RestoranKurulum.iss).
name: restoran-otomasyonu
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - db-backups:/var/opt/mssql/backup
    restart: unless-stopped

  backend:
    build: .
    environment:
      DB_SERVER: db
      DB_DATABASE: "${DB_DATABASE:-RestoranDB}"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PORT: "1433"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: "4091"
      NODE_ENV: production
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080,http://localhost:8081}"
      BACKUP_FS_DIR: "/app/db-backups"
    ports:
      - "4091:4091"
    volumes:
      - uploads:/app/uploads
      - db-backups:/app/db-backups
      - logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

  panel:
    build:
      context: ./restoran-panel
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4091/api}"
        VITE_CUSTOMER_MENU_URL: "${VITE_CUSTOMER_MENU_URL:-http://localhost:8081}"
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ============================================================
  # KALDIRILAN SERVİSLER: customer-menu ve cloudflared
  #
  # customer-menu — müşteri QR menüsünü servis eden nginx konteyneriydi
  # (:8081) ve '/api'yi backend'e proxy'liyordu. Menüyü artık backend'in
  # kendisi statik olarak servis ediyor (server.js), bu yüzden
  # musteri-menu/Dockerfile ve musteri-menu/nginx.conf silindi. Menüye
  # geliştirmede 'cd musteri-menu && npm run dev' (:5174) ile,
  # üretimde http://<sunucu>:4091/<qrToken> ile erişilir.
  #
  # cloudflared — menüyü mobil veriye açan opsiyonel tüneldi ve GÜVENLİĞİ
  # customer-menu konteynerine bağlanmaktan geliyordu: nginx yalnızca
  # /api/public/* ve GET /api/settings uçlarını geçiriyor, yönetim API'si
  # internete HİÇ çıkmıyordu. O filtre katmanı artık yok — 4091'i olduğu
  # gibi tünellemek TÜM yönetim API'sini internete açar. Menüyü dışarı
  # açmak gerekirse tüneli/ters proxy'yi yalnızca /public ve /uploads
  # yollarına izin verecek şekilde yapılandırın.
  # ============================================================

volumes:
  mssql-data:
  uploads:
  db-backups:
  logs:
