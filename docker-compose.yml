# ============================================================
# Restoran POS — tam yığın (MSSQL + backend + panel)
# Kullanım:
#   1) Kök dizinde .env oluşturun (JWT_SECRET, DB_PASSWORD zorunlu)
#   2) docker compose up -d --build
#   3) Veritabanını ve şemayı hazırlayın (ilk kurulumda bir kez):
#        docker compose exec db /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa \
#          -P "$DB_PASSWORD" -C -Q "IF DB_ID('RestoranDB') IS NULL CREATE DATABASE RestoranDB"
#        docker compose run --rm backend npm run migrate
#      (Not: mssql/server imajı mssql-tools18'e geçti — eski yollarda
#      kurulu 'mssql-tools' imajlarında hâlâ /opt/mssql-tools/bin/sqlcmd
#      olabilir, -C bayrağı sertifika güvenini kabul eder.)
#   Panel:         http://localhost:8080
#   Müşteri Menü:  http://localhost:8081
#   Backend:       http://localhost:4091
# ============================================================
# 'name' SABİT tutulur (klasör adına göre otomatik türetilmez): scripts/
# paketle.ps1 ile offline paketlenen imaj etiketleri (<name>-backend vb.)
# bu sabit isme göre üretilir. installer/postinstall.ps1 dosyaları
# C:\RestoranOtomasyonu gibi FARKLI bir klasöre kopyaladığı için, isim
# klasöre göre türetilseydi 'docker compose up -d' yüklenen imajları
# bulamaz, offline kurulum bozulurdu (bkz. installer/RestoranKurulum.iss).
name: restoran-otomasyonu
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - db-backups:/var/opt/mssql/backup
    restart: unless-stopped

  backend:
    build: .
    environment:
      DB_SERVER: db
      DB_DATABASE: "${DB_DATABASE:-RestoranDB}"
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_PORT: "1433"
      JWT_SECRET: "${JWT_SECRET}"
      PORT: "4091"
      NODE_ENV: production
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8080,http://localhost:8081}"
      BACKUP_FS_DIR: "/app/db-backups"
    ports:
      - "4091:4091"
    volumes:
      - uploads:/app/uploads
      - db-backups:/app/db-backups
      - logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

  panel:
    build:
      context: ./restoran-panel
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4091/api}"
        VITE_CUSTOMER_MENU_URL: "${VITE_CUSTOMER_MENU_URL:-http://localhost:8081}"
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  customer-menu:
    build:
      context: ./musteri-menu
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4091/api}"
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql-data:
  uploads:
  db-backups:
  logs:
